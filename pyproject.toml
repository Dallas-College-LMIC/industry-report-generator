[project]
name = "industry-report-generator"
version = "0.1.0"
description = "Config-driven industry report data generation for Dallas College LMIC"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pyghtcast",
    "dclmic-export",
]

[project.optional-dependencies]
dashboard = ["streamlit", "plotly", "fredapi", "sodapy"]
zip = ["censusdis"]

[project.scripts]
industry-report = "industry_report.cli:main"
industry-report-dashboard = "industry_report.dashboard_launcher:main"

[tool.uv.sources]
pyghtcast = { git = "https://github.com/Dallas-College-LMIC/pyghtcast" }
dclmic-export = { git = "https://github.com/Dallas-College-LMIC/dclmic-export" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industry_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
